server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Хешированные ассеты Vite можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API за тем же origin, что и фронт: refresh-cookie (SameSite=Strict) работает
    # при открытии и по localhost, и по 127.0.0.1, CORS не нужен (#62).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Анализ обращения с LLM может идти дольше минуты.
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # SPA-фоллбэк: все неизвестные пути отдаём index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
