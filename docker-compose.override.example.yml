# Dev-режим в Docker: бэк с hot reload, фронт через `npm run dev`.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   make up
#
# docker compose подхватывает docker-compose.override.yml автоматически (он в .gitignore).
# Нужен Docker Compose >= 2.24 (теги !reset / !override).
# Альтернатива без Docker для кода — см. docs/devops.md, раздел «Dev-режим».

services:
  backend:
    # Исходники с хоста поверх /app. Анонимный том сохраняет .venv из образа,
    # иначе монтирование затрёт установленные зависимости.
    volumes:
      - ./backend:/app
      - /app/.venv
    # TODO(Кирилл): сверить команду миграций и путь к приложению с backend/README.md.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn ${BACKEND_APP:-src.web.main:app} --reload --host 0.0.0.0 --port 8000",
      ]

  frontend:
    # Вместо nginx-сборки — Vite dev server на 5173 с HMR.
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      # Надёжный file watching при монтировании с хоста (macOS/WSL).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "${BIND_HOST:-127.0.0.1}:5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
