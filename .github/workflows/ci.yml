name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Бэк и фронт появляются в репо не сразу: hashFiles недоступен в job-level `if`,
  # поэтому наличие каркасов определяем отдельным job и передаём через outputs.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres для интеграционных тестов; юнит-тестам не мешает.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodprozr
          POSTGRES_PASSWORD: kodprozr
          POSTGRES_DB: kodprozr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kodprozr -d kodprozr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://kodprozr:kodprozr@localhost:5432/kodprozr
      CORS_ORIGINS: http://localhost:5173
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: ci-dummy
      LLM_MODEL: qwen2.5:7b-instruct
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Версию Python uv берёт из backend/.python-version / requires-python.
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Import boundaries
        run: uv run lint-imports

      # Код 5 = «тестов не найдено» — на старте каркаса это не ошибка.
      - name: Pytest
        run: uv run pytest || [ $? -eq 5 ]

      # Полный набор синтетики с предрасчётом, затем smoke всех эндпоинтов (OPS-06).
      # LLM в CI нет: разбор обращений и докладные идут по фоллбэку.
      - name: Seed full synthetic data
        env:
          LLM_BASE_URL: ""
        run: |
          uv run alembic upgrade head
          uv run python -m src.seed --dir ../data/generated

      - name: Smoke
        env:
          LLM_BASE_URL: ""
        run: |
          uv run uvicorn src.web.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 60); do curl -fs http://localhost:8000/health && break; sleep 1; done
          python3 ../scripts/smoke.py --api http://localhost:8000 || (cat /tmp/uvicorn.log; exit 1)

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generator tests
        run: python -m unittest discover -s data/tests -t .

      - name: Data check
        run: |
          python -m data.generator.check data/generated
          python -m data.generator.check data/generated/sample --partial

      # Набор в git совпадает с генератором (кроме appeals.json: там предрасчёт AI-06).
      - name: Deterministic generator
        run: |
          python -m data.generator --seed 42 --out /tmp/generated
          diff -r --exclude=appeals.json /tmp/generated data/generated
          diff /tmp/generated/sample/appeals.json data/generated/sample/appeals.json

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v5

      # Кэш npm требует frontend/package-lock.json — он должен быть в git.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
