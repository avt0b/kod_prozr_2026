name: Workflow policy

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Номер PR для повторной проверки после изменения issue
        type: number
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test workflow rules
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate branch, issue, assignee and messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python scripts/check_workflow.py --repo "$REPO" --pr "$PR_NUMBER"
