# Весь стек «Код прозрачности» в Docker. Описание сервисов и команд — docs/devops.md.
#
#   cp .env.example .env && make up
#
# Значения ${VAR:-default} берутся из .env в корне (compose читает его сам).
# Порты публикуются на ${BIND_HOST} (по умолчанию 127.0.0.1): на VPS наружу
# смотрит только reverse proxy (Caddy/nginx), а не сами сервисы.

name: kodprozr

services:
  postgres:
    image: postgres:16-alpine
    container_name: kodprozr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kodprozr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodprozr}
      POSTGRES_DB: ${POSTGRES_DB:-kodprozr}
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kodprozr} -d ${POSTGRES_DB:-kodprozr}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kodprozr-backend:local
    container_name: kodprozr_backend
    env_file:
      - path: .env
        required: false
    environment:
      # DATABASE_URL в .env уже смотрит на postgres:5432 (имя сервиса), но задаём
      # и здесь, чтобы стек поднимался даже без .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kodprozr:kodprozr@postgres:5432/kodprozr}
    # Миграции перед стартом, затем uvicorn.
    # TODO(Кирилл): сверить с backend/README.md, когда каркас бэка будет готов:
    #   - команду миграций (предполагаем alembic; venv образа в PATH, поэтому без `uv run`;
    #     если в образе остаётся uv — можно `uv run --no-sync alembic upgrade head`);
    #   - путь к ASGI-приложению (BACKEND_APP, по умолчанию как в optimus: src.web.main:app).
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn ${BACKEND_APP:-src.web.main:app} --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Контракт: GET /health -> 200 {"status": "ok"}. curl в slim-образе нет, поэтому python.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite вшивает адрес API в бандл на этапе сборки — после смены нужен `make build`.
        # В frontend/Dockerfile должен быть `ARG VITE_API_URL`.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    image: kodprozr-frontend:local
    container_name: kodprozr_frontend
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # nginx:alpine: wget есть в busybox; 127.0.0.1, а не localhost — nginx может не слушать ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Локальная LLM с OpenAI-совместимым API. Поднимается только с профилем:
  #   make llm-up   (или docker compose --profile llm up -d ollama)
  # Бэку в .env: LLM_BASE_URL=http://ollama:11434/v1, LLM_API_KEY=ollama (любая непустая строка).
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: kodprozr_ollama
    profiles: ["llm"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # NVIDIA GPU (нужен nvidia-container-toolkit на хосте) — раскомментировать:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
    driver: local

  ollama_models:
    driver: local
