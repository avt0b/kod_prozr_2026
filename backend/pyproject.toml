[project]
name = "kodprozr-backend"
version = "0.1.0"
description = "Рабочее место аналитика по профилактике коррупции: граф связей служащих, риск-скоринг, разбор обращений"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.26.0",
  "loguru>=0.7.3",
  "nh3>=0.2.20",
  "numpy>=2.5.4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pymorphy3>=2.0.6",
  "pymorphy3-dicts-ru>=2.4.417150.4580142",
  "rapidfuzz>=3.14.6",
  "scikit-learn>=1.9.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-mock>=3.14",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.8",
]

# ---------------------------------------------------------------------------
# Границы слоёв и модулей. Проверка: `uv run lint-imports` (входит в `make lint`).
# Ослаблять контракты нельзя — нарушение чинится портом + ACL-адаптером в src/web.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers inside every module: presentation -> application -> domain"
type = "layers"
containers = [
  "src.modules.officials",
  "src.modules.counterparties",
  "src.modules.risk",
  "src.modules.appeals",
  "src.modules.reports",
  "src.modules.assistant",
  "src.modules.stats",
]
layers = ["presentation", "application", "(domain)"]

[[tool.importlinter.contracts]]
name = "Bounded contexts do not import each other"
type = "independence"
modules = [
  "src.modules.officials",
  "src.modules.counterparties",
  "src.modules.risk",
  "src.modules.appeals",
  "src.modules.reports",
  "src.modules.assistant",
  "src.modules.stats",
]

[[tool.importlinter.contracts]]
name = "Domain and Application independent of Infrastructure"
type = "forbidden"
source_modules = [
  "src.modules.officials.domain",
  "src.modules.officials.application",
  "src.modules.counterparties.domain",
  "src.modules.counterparties.application",
  "src.modules.risk.domain",
  "src.modules.risk.application",
  "src.modules.appeals.domain",
  "src.modules.appeals.application",
  "src.modules.reports.domain",
  "src.modules.reports.application",
  "src.modules.assistant.domain",
  "src.modules.assistant.application",
  "src.modules.stats.application",
]
forbidden_modules = [
  "src.modules.officials.infrastructure",
  "src.modules.counterparties.infrastructure",
  "src.modules.risk.infrastructure",
  "src.modules.appeals.infrastructure",
  "src.modules.reports.infrastructure",
  "src.modules.assistant.infrastructure",
  "src.modules.stats.infrastructure",
  "src.core.infrastructure.database",
  "src.core.infrastructure.llm",
  "src.core.infrastructure.dependencies",
  "src.core.infrastructure.exception_handler",
  "sqlalchemy",
  "fastapi",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "Domain is pure Python (no Pydantic)"
type = "forbidden"
source_modules = [
  "src.modules.officials.domain",
  "src.modules.counterparties.domain",
  "src.modules.risk.domain",
  "src.modules.appeals.domain",
  "src.modules.reports.domain",
  "src.modules.assistant.domain",
]
forbidden_modules = ["pydantic", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "Core is independent of modules and composition root"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.modules", "src.web", "src.seed", "src.eval"]

[[tool.importlinter.contracts]]
name = "Modules do not know the composition root"
type = "forbidden"
source_modules = ["src.modules"]
forbidden_modules = ["src.web", "src.seed", "src.eval"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-select = ["PLC0415"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402", "F401"]
